<div class="modal-backdrop-custom" [class.show]="isOpen">
  <div class="modal-content-custom">
    <div class="modal-icon mb-3">
      <img *ngIf="type === 'success'" src="assets/lottie/lottieflow-success.gif" alt="success" class="modal-animated-img">
      <img *ngIf="type === 'error'" src="assets/lottie/lottieflow-error.gif" alt="error" class="modal-animated-img">
      <img *ngIf="type === 'warning'" src="assets/warning.gif" alt="تحذير" class="modal-animated-img">
    </div>
    <h5 class="fw-bold mb-2">{{ title }}</h5>
    <p class="text-muted">{{ message }}</p>
    <div class="mt-3">
      <button class="button" (click)="close()">موافق</button>
    </div>
  </div>
</div>
