<div dir="rtl" class="video-layout p-0">
  <!-- Sidebar -->
  <div class="sidebar d-none d-md-block">
    <app-sidebar [course]="course" [selectedVideoId]="videoId"></app-sidebar>
  </div>

  <div class="d-block d-md-none">
    <button
      class="btn btn-primary"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#offcanvasExample"
      aria-controls="offcanvasExample"
    >
      <i class="bi bi-list"></i>
    </button>

    <div
      class="offcanvas offcanvas-start"
      tabindex="-1"
      id="offcanvasExample"
      aria-labelledby="offcanvasExampleLabel"
    >
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasExampleLabel"></h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body">
        <app-sidebar
          [course]="course"
          [selectedVideoId]="videoId"
        ></app-sidebar>
      </div>
    </div>
  </div>

  <!-- Video -->
  <div class="main-video p-3">
    <div class="d-flex align-items-center gap-2 mb-2">
      <i
        class="bi bi-play-btn"
        style="font-size: 24px"
      ></i>
      <h2 style="font-size: 22px; margin: 0">{{ videoTitle }}</h2>
    </div>

    <hr style="border-top: 2px solid #dee2e6" />

    <div class="video-container">
      <iframe
        [src]="sanitizedVideoUrl"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>
  </div>
</div>
