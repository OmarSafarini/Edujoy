<div style="background-color: #fafafa; width: 100%; height: 100vh">
  <div class="container d-flex flex-column align-items-center" dir="rtl">
    <h2 class="mt-5">{{ course?.name }}</h2>

        <hr style="width: 100%;">

    <div class="progress-block p-3 my-3 shadow-sm border-0">
      <div
        dir="ltr"
        class="progress"
        role="progressbar"
        aria-label="Success example"
        aria-valuenow="25"
        aria-valuemin="0"
        aria-valuemax="100"
        style="width: 100%;"
      >
        <div class="progress-bar" style="width: 25%; background-color: rgb(102, 28, 206);">25%</div>
      </div>

    </div>

    <div class="lessons-body">
      <app-lesson-block
        style="width: 100%"
        *ngFor="let lesson of course?.lessons"
        [lesson]="lesson"
      ></app-lesson-block>
    </div>
  </div>
</div>
