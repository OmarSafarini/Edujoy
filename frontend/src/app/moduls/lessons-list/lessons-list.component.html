<div style="background-color: #ffffff; width: 100%; height: 100%">
   <div class="d-flex justify-content-center align-items-center"   style="background-color: blueviolet;">
        <h2 class="mt-5 text-white py-4" >{{ course?.name }}</h2>
    </div>
  <div class="container d-flex flex-column align-items-center" dir="rtl">
    
    <h2 class="mt-5 pt-3">{{ course?.name }}</h2>

        <hr style="width: 100%;">

    <div class="progress-block p-0 my-3 shadow-sm border-0 rounded">
      <div
        dir="ltr"
        class="progress"
        role="progressbar"
        aria-label="Success example"
        aria-valuenow="25"
        aria-valuemin="0"
        aria-valuemax="100"
        style="width: 100%;"
      >
        <div class="progress-bar" style="width: 25%; background-color: rgb(102, 28, 206);">25%</div>
      </div>
    </div>

<button type="button" class="btn d-inline-flex align-items-center" style="background-color: rgb(102, 28, 206); color: white;" (click)="openLessonForm()">
  <span class="me-2">+</span> إضافة درس
</button>


    <div *ngIf = "isLessonFormOpen">
          <app-add-lesson-to-course [courseId]="course.id"></app-add-lesson-to-course>
    </div>


    <div class="lessons-body">
      <app-lesson-block
        style="width: 100%"
        *ngFor="let lesson of course?.lessons"
        [lesson]="lesson"
      ></app-lesson-block>
    </div>
  </div>
</div>
