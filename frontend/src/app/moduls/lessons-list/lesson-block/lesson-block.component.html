<div
  class="lesson-item p-3 my-2 shadow-sm rounded"
  [ngStyle]="{
    width: '100%',
    borderRight: '10px solid ' + theamColor
  }"
>
  <div class="d-flex justify-content-between">
    <div class="d-flex justify-content-start">
      <a
      class="btn lesson-collapse"
      data-bs-toggle="collapse"
      [attr.href]="'#collapse' + lesson.id"
      role="button"
      aria-expanded="false"
      [attr.aria-controls]="'collapse' + lesson.id"
      style="width: auto; height: 100%; margin-bottom: 5px"
    >
      {{ lesson.name }}
      <i class="bi bi-chevron-down"></i>
    </a>
    <!-- GIF الصوت قبل السهم -->
    <img 
      src="assets/lottie/speaker.gif" 
      alt="play" 
      class="speak-btn-gif ms-2"
      (click)="speakLessonTitle(lesson)"
    >
    </div>
    
    <!-- <a class="btn" (click)="openAddVideoForm()">
      <i class="bi bi-plus" style="font-size: 20px"></i>
    </a> -->
  </div>

  <div class="collapse show" [attr.id]="'collapse' + lesson.id">
    <div class="card card-body" style="background-color: gainsboro">
      <div class="videos-list">
        <ul>
          <li *ngIf="!lesson.videos || lesson.videos.length === 0">
            <em class="text-muted">لا يوجد فيديوهات لهذا الدرس</em>
          </li>

          <li
            *ngFor="let video of lesson?.videos"
            class="list-group-item d-flex justify-content-between align-items-center rounded shadow-sm my-2 px-3 py-2"
            [ngStyle]="{
                backgroundColor: '#f8f9fa',
                borderRight: '10px solid ' + theamColor
            }"
          >
            <a
              class="text-decoration-none d-flex justify-content-start"
              style="width: 100%; color: black"
              [routerLink]="['/course', lesson.course_id, 'video', video.id]"
            >
              <div
                class="ms-3"
                style="
                  border-radius: 50%;
                  border: solid 2px rgb(102, 28, 206);
                  height: 20px;
                  width: 20px;
                "
              ></div>

              {{ video.title }}
            </a>
          </li>

          <li
            *ngIf="lesson.videos.length != 0"
            class="list-group-item d-flex justify-content-between align-items-center rounded shadow-sm my-2 px-3 py-2 border-0"
            style="background-color: #f8f9fa"
          >
            <a
              class="text-decoration-none d-flex justify-content-start"
              style="width: 100%; color: black"
              [routerLink]="['/question', lesson.id]"
            >
              <div
                class="ms-3"
                style="
                  border-radius: 50%;
                  border: solid 2px rgb(102, 28, 206);
                  height: 20px;
                  width: 20px;
                "
              ></div>
              إبدًا الإختبار
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>

<div *ngIf="isFormOpen" class="addVideoForm">
  <app-add-video-to-lesson
    [lessonId]="lessonId"
    (onBack)="openAddVideoForm($event)"
  ></app-add-video-to-lesson>
</div>

<app-modal #videoModal></app-modal>
